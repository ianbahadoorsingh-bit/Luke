name: Enable GitHub Pages

on:
  push:
    branches: ['claude/caribbean-golf-hub-mvp-46kPW']
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from gh-pages branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const result = await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: { branch: 'gh-pages', path: '/' }
              });
              console.log('Pages enabled! URL:', result.data.html_url);
            } catch(e) {
              if (e.status === 409) {
                console.log('Pages is already configured — nothing to do.');
              } else {
                core.setFailed(`Failed to enable Pages: ${e.message} (status ${e.status})`);
              }
            }
