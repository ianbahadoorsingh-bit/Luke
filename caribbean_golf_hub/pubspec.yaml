name: caribbean_golf_hub
description: Caribbean Golf Hub — Premier golf directory, tournaments, and specials for T&T and the Caribbean.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase core suite
  firebase_core: ^2.27.1
  cloud_firestore: ^4.15.9
  firebase_auth: ^4.19.6
  firebase_messaging: ^14.9.4
  firebase_storage: ^11.7.6

  # Navigation
  go_router: ^13.2.1

  # Networking / images
  cached_network_image: ^3.3.1
  http: ^1.2.1

  # UX / loading
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Platform integrations
  url_launcher: ^6.2.6
  flutter_local_notifications: ^17.2.1+2

  # Data / utils
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/placeholder.png
